<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Идеи — агенту</title>
<meta name="description" content="Асинхронный чат с агентом: отправляй идеи, даже когда компьютер выключен">
<meta name="theme-color" content="#140c08">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="apple-mobile-web-app-capable" content="yes">
<link rel="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <div class="titlewrap">
        <h1>Идеи</h1>
        <p id="status" class="status" data-kind="idle">Загрузка…</p>
      </div>
    </div>
    <div class="actions">
      <button id="btnSync" class="iconbtn" type="button" title="Синхронизировать" aria-label="Синхронизировать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
      <button id="btnSettings" class="iconbtn" type="button" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div id="install" class="install hidden">
    <span id="installText" class="install-text"></span>
    <button id="btnInstall" class="hidden" type="button">Установить</button>
    <button id="btnInstallClose" class="install-close" type="button" aria-label="Скрыть">×</button>
  </div>

  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Идея…" enterkeyhint="send" aria-label="Новая идея"></textarea>
    <button id="btnSend" class="send" type="button" aria-label="Отправить" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    </button>
  </footer>
</div>

<div id="settings" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Настройки">
  <div class="sheet-card">
    <h2>Настройки</h2>
    <label>Репозиторий
      <input id="cfgRepo" type="text" placeholder="владелец/репозиторий" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>Ветка
      <input id="cfgBranch" type="text" placeholder="main" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>Токен GitHub
      <span class="token-row">
        <input id="cfgToken" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="btnEye" class="mini" type="button" aria-label="Показать токен">Показать</button>
      </span>
    </label>
    <p class="hint">Токен хранится только на этом телефоне. Нужен fine-grained токен с правом «Contents: Read and write» на репозиторий <b>socdevvv/ideas</b>. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Создать токен</a></p>
    <div class="sheet-actions">
      <button id="btnCheck" class="secondary" type="button">Проверить связь</button>
      <button id="btnExport" class="secondary" type="button">Скачать JSON</button>
      <button id="btnClose" class="primary" type="button">Готово</button>
    </div>
    <p id="sheetMsg" class="sheet-msg"></p>
    <p class="hint small">Ответы появляются, когда компьютер включён. На iPhone: «Поделиться» → «На экран „Домой“».</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
